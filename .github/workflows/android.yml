name: Build app and publish release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "firmware/prebuilt/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the app
        run: gradle -p android/MediaRemoteCompanion assembleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir -p dist
          cp android/MediaRemoteCompanion/app/build/outputs/apk/release/app-release.apk dist/MediaRemote.apk
          cp firmware/prebuilt/MediaRemote.uf2 dist/MediaRemote.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: media-remote
          path: dist/

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest build from ${GITHUB_SHA::7}.

          - **MediaRemote.apk**: Android companion app. Open this page on your phone, tap the file and install it.
          - **MediaRemote.uf2**: remote firmware. Double-tap reset on the remote and drag this onto the USB drive that appears."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest app and firmware" --notes "$NOTES" --latest
          else
            gh release edit latest --notes "$NOTES"
          fi
          gh release upload latest dist/MediaRemote.apk dist/MediaRemote.uf2 --clobber
